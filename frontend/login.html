
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SmartCity</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">SmartCity<span>.</span></a>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="register.html" class="nav-btn">Créer un compte</a>
        </nav>
    </header>

    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">👤</div>

            <h1>Bienvenue !</h1>
            <p class="subtitle">Connectez-vous à votre espace citoyen</p>

        <div id="loginMessage">

            <form id="loginForm">
                <label for="email">Adresse e-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="exemple@email.com"
                    required
                >

                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Entrez votre mot de passe"
                    required
                >

                <button type="submit">Se connecter →</button>
            </form>
           </div>
            <p class="register-link">
                Vous n'avez pas encore de compte ?
                <a href="register.html">Créer un compte</a>
            </p>

            <a href="index.html" class="back-link">← Retour à l'accueil</a>

        </div>

    </main>

    <footer>
        © 2026 SmartCity - Réclamations citoyennes
    </footer>
     <script src="js/script.js"></script>
</body>
</html>
