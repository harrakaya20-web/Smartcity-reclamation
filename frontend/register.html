
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SmartCity</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">SmartCity<span>.</span></a>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="login.html">Connexion</a>
            <a href="register.html" class="nav-btn">Inscription</a>
        </nav>
    </header>

    <main class="register-page">

        <div class="register-card">

            <div class="register-icon">👤</div>

            <h1>Créer un compte</h1>

            <p class="subtitle">
                Rejoignez SmartCity et participez à l'amélioration de votre ville.
            </p>

        <div id="registerMessage">

            <form id="registerForm">
                <label for="name">Nom complet</label>
                <input type="text" id="name"
                       placeholder="Votre nom complet" required>

                <label for="email">Adresse e-mail</label>
                <input type="email" id="email"
                       placeholder="Votre adresse e-mail" required>

                <label for="phone">Téléphone</label>
                <input type="tel" id="phone"
                       placeholder="Votre numéro de téléphone">

                <label for="password">Mot de passe</label>
                <input type="password" id="password"
                       placeholder="Créer un mot de passe" required>

                <label for="confirmPassword">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword"
                       placeholder="Confirmer le mot de passe" required>

                <button type="submit">Créer mon compte →</button>
            </form>
        </div>
            <p class="login-link">
                Vous avez déjà un compte ?
                <a href="login.html">Se connecter</a>
            </p>

            <a href="index.html" class="back-link">
                ← Retour à l'accueil
            </a>

        </div>

    </main>

    <footer>
        © 2026 SmartCity - Réclamations citoyennes
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
