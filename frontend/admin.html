
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - SmartCity</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header>
        <h2>SmartCity Admin</h2>

        <nav>
            <a href="index.html">Accueil</a>
            <a href="mes-reclamations.html">Mes réclamations</a>
            <a href="login.html" id="adminLogout">Déconnexion</a>
        </nav>
    </header>

    <main class="admin-container">

        <h1>Tableau de bord Administrateur</h1>
        <p>Gestion et suivi des réclamations citoyennes.</p>

        <!-- Statistiques -->
        <section class="stats">

            <div class="stat-card">
                <h3 id="adminTotal">0</h3>
                <p>Total des réclamations</p>
            </div>

            <div class="stat-card">
                <h3 id="adminPending">0</h3>
                <p>En attente</p>
            </div>

            <div class="stat-card">
                <h3 id="adminProgress">0</h3>
                <p>En cours</p>
            </div>

            <div class="stat-card">
                <h3 id="adminResolved">0</h3>
                <p>Résolues</p>
            </div>

        </section>

        <!-- Liste des réclamations -->
        <section class="complaints-list">

            <h2>Toutes les réclamations</h2>

            <p id="adminMessage"></p>

            <div class="table-container">
                <table>

                    <thead>
                        <tr>
                            <th>Citoyen</th>
                            <th>Titre</th>
                            <th>Catégorie</th>
                            <th>Lieu</th>
                            <th>Date</th>
                            <th>Statut</th>
                        </tr>
                    </thead>

                    <tbody id="adminTableBody">
                        <tr>
                            <td colspan="6">Chargement des réclamations...</td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
